name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pulsepond/build.gradle.kts)
          test -n "$version"
          test "$RELEASE_TAG" = "v$version"
      - name: Validate and build release artifacts
        run: ./gradlew check lint publishToMavenLocal --no-daemon
      - name: Upload reviewed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            pulsepond/build/outputs/aar/pulsepond-release.aar \
            pulsepond/build/intermediates/source_jar/release/release-sources.jar \
            pulsepond/build/publications/release/pom-default.xml
